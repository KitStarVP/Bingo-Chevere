<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6C63FF">
    <title>Verificando Pago</title>
    <link rel="stylesheet" href="css/mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .verification-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--bg);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .verification-screen h2 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 12px;
        }
        .verification-screen p {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 24px;
        }
        .ref-display {
            background: var(--card-bg);
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="verification-screen">
            <div class="spinner"></div>
            <h2>Verificando tu Pago</h2>
            <p>Por favor espera mientras confirmamos tu transacción</p>
            <div class="ref-display">Ref: <span id="ref">****</span></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKK_aY4OeEh4NmRIAExKk4T0i7d4Z1_8M",
            authDomain: "bingo-chevere.firebaseapp.com",
            databaseURL: "https://bingo-chevere-default-rtdb.firebaseio.com/",
            projectId: "bingo-chevere",
            storageBucket: "bingo-chevere.firebasestorage.app",
            messagingSenderId: "1057150163831",
            appId: "1:1057150163831:web:0d6e9f70c356ee56b09f72"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const params = new URLSearchParams(window.location.search);
        const ref = params.get('ref');
        const id = params.get('id');

        document.getElementById('ref').textContent = ref || '****';

        if (id) {
            onValue(ref(database, `purchases/${id}`), snap => {
                const purchase = snap.val();
                if (purchase) {
                    if (purchase.status === 'verified') {
                        window.location.href = 'juego.html';
                    } else if (purchase.status === 'rejected') {
                        alert('Pago rechazado');
                        window.location.href = 'comprar.html';
                    }
                }
            });
        }
    </script>
</body>
</html>
