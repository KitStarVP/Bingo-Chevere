<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6C63FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bingo Chévere</title>
    <link rel="stylesheet" href="css/mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header compacto -->
        <header class="mobile-header">
            <div class="header-brand">
                <svg class="brand-logo" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <circle cx="25" cy="25" r="23" fill="url(#logoGrad)" stroke="#fff" stroke-width="2"/>
                    <text x="25" y="32" font-family="Inter" font-weight="900" font-size="20" fill="#fff" text-anchor="middle">B</text>
                    <circle cx="15" cy="15" r="3" fill="#fff" opacity="0.8"/>
                    <circle cx="35" cy="15" r="2" fill="#fff" opacity="0.6"/>
                    <circle cx="38" cy="30" r="2.5" fill="#fff" opacity="0.7"/>
                </svg>
                <div class="brand-text">
                    <h1>Bingo Chévere</h1>
                    <span class="brand-subtitle">¡Juega y Gana!</span>
                </div>
            </div>
            <button class="admin-access" id="admin-btn">⚙️</button>
        </header>

        <!-- Premio destacado -->
        <section class="prize-hero">
            <div class="prize-badge">
                <span class="prize-label">Premio Total</span>
                <div class="prize-value" id="total-prize">BsF 0</div>
            </div>
            <div class="prize-split">
                <div class="split-item">
                    <span class="split-icon">🎯</span>
                    <span class="split-label">Patrón</span>
                    <span class="split-value" id="prize-pattern">BsF 0</span>
                </div>
                <div class="split-divider"></div>
                <div class="split-item">
                    <span class="split-icon">🏆</span>
                    <span class="split-label">Lleno</span>
                    <span class="split-value" id="prize-full">BsF 0</span>
                </div>
            </div>
        </section>

        <!-- Horarios compactos -->
        <section class="schedule-compact">
            <h2 class="section-title">
                <span class="title-icon">⏰</span>
                Horarios de Hoy
            </h2>
            <div class="schedule-chips">
                <div class="chip">1:00 PM</div>
                <div class="chip">5:00 PM</div>
                <div class="chip">9:00 PM</div>
            </div>
            <div class="price-tag">
                <span class="price-icon">🎫</span>
                <span id="ticket-price">60 BsF por cartón</span>
            </div>
        </section>

        <!-- Acciones principales -->
        <section class="main-actions">
            <a href="comprar.html" class="action-btn primary">
                <span class="btn-icon">🛒</span>
                <span class="btn-text">Comprar Cartones</span>
                <span class="btn-arrow">→</span>
            </a>
            <a href="juego.html" class="action-btn secondary">
                <span class="btn-icon">🎮</span>
                <span class="btn-text">Ir al Juego</span>
                <span class="btn-arrow">→</span>
            </a>
        </section>

        <!-- Navegación inferior -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Inicio</span>
            </a>
            <a href="comprar.html" class="nav-item">
                <span class="nav-icon">🎫</span>
                <span class="nav-label">Comprar</span>
            </a>
            <a href="juego.html" class="nav-item">
                <span class="nav-icon">🎮</span>
                <span class="nav-label">Jugar</span>
            </a>
            <a href="premios.html" class="nav-item">
                <span class="nav-icon">🏆</span>
                <span class="nav-label">Premios</span>
            </a>
            <a href="perfil.html" class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Perfil</span>
            </a>
        </nav>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKK_aY4OeEh4NmRIAExKk4T0i7d4Z1_8M",
            authDomain: "bingo-chevere.firebaseapp.com",
            databaseURL: "https://bingo-chevere-default-rtdb.firebaseio.com/",
            projectId: "bingo-chevere",
            storageBucket: "bingo-chevere.firebasestorage.app",
            messagingSenderId: "1057150163831",
            appId: "1:1057150163831:web:0d6e9f70c356ee56b09f72"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        window.firebase = { database, ref, onValue };
    </script>
    <script src="js/landing.js"></script>
</body>
</html>
