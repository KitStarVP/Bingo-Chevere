<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Test - Generar Compras</title>\n    <style>\n        body { font-family: Arial, sans-serif; padding: 20px; }\n        .container { max-width: 500px; margin: 0 auto; }\n        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }\n        button:hover { background: #0056b3; }\n        .result { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 5px; }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <h1>🧪 Generador de Compras de Prueba</h1>\n        <p>Para probar el panel de administración</p>\n        \n        <button onclick=\"generateTestPurchase()\">Generar Compra Pendiente</button>\n        <button onclick=\"generateMultiplePurchases()\">Generar 5 Compras</button>\n        <button onclick=\"clearAllPurchases()\">Limpiar Todas las Compras</button>\n        \n        <div id=\"results\"></div>\n    </div>\n\n    <!-- Firebase Configuration -->\n    <script type=\"module\">\n      import { initializeApp } from \"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js\";\n      import { getDatabase, ref, set, get, push, remove } from \"https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js\";\n\n      const firebaseConfig = {\n        apiKey: \"AIzaSyAKK_aY4OeEh4NmRIAExKk4T0i7d4Z1_8M\",\n        authDomain: \"bingo-chevere.firebaseapp.com\",\n        databaseURL: \"https://bingo-chevere-default-rtdb.firebaseio.com/\",\n        projectId: \"bingo-chevere\",\n        storageBucket: \"bingo-chevere.firebasestorage.app\",\n        messagingSenderId: \"1057150163831\",\n        appId: \"1:1057150163831:web:0d6e9f70c356ee56b09f72\"\n      };\n\n      const app = initializeApp(firebaseConfig);\n      const database = getDatabase(app);\n      \n      window.firebase = { database, ref, set, get, push, remove };\n      console.log('Firebase inicializado para test');\n    </script>\n\n    <script>\n        function showResult(message, type = 'info') {\n            const results = document.getElementById('results');\n            const div = document.createElement('div');\n            div.className = 'result';\n            div.style.background = type === 'success' ? '#d4edda' : type === 'error' ? '#f8d7da' : '#f8f9fa';\n            div.textContent = message;\n            results.appendChild(div);\n            \n            // Auto-remove after 5 seconds\n            setTimeout(() => {\n                if (div.parentNode) {\n                    div.parentNode.removeChild(div);\n                }\n            }, 5000);\n        }\n\n        function generateRandomPhone() {\n            const prefixes = ['0414', '0424', '0412', '0416', '0426'];\n            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];\n            const number = Math.floor(Math.random() * 10000000).toString().padStart(7, '0');\n            return prefix + number;\n        }\n\n        function generateRandomRef() {\n            return Math.floor(Math.random() * 10000).toString().padStart(4, '0');\n        }\n\n        async function generateTestPurchase() {\n            if (!window.firebase) {\n                showResult('❌ Firebase no disponible', 'error');\n                return;\n            }\n\n            const { database, ref, set } = window.firebase;\n            \n            const purchase = {\n                id: Date.now(),\n                ref: generateRandomRef(),\n                amount: Math.floor(Math.random() * 5 + 1) * 60, // 1-5 cartones\n                cartones: Math.floor(Math.random() * 5 + 1),\n                phone: generateRandomPhone(),\n                date: new Date().toISOString().split('T')[0],\n                status: 'pending',\n                timestamp: Date.now()\n            };\n\n            try {\n                await set(ref(database, `purchases/${purchase.id}`), purchase);\n                showResult(`✅ Compra generada: ${purchase.phone} - ${purchase.cartones} cartones - Ref: ${purchase.ref}`, 'success');\n            } catch (error) {\n                showResult(`❌ Error: ${error.message}`, 'error');\n            }\n        }\n\n        async function generateMultiplePurchases() {\n            showResult('🔄 Generando 5 compras...');\n            \n            for (let i = 0; i < 5; i++) {\n                await generateTestPurchase();\n                await new Promise(resolve => setTimeout(resolve, 200)); // Esperar 200ms entre cada una\n            }\n            \n            showResult('✅ 5 compras generadas correctamente', 'success');\n        }\n\n        async function clearAllPurchases() {\n            if (!confirm('¿Estás seguro de que quieres eliminar TODAS las compras?')) {\n                return;\n            }\n\n            if (!window.firebase) {\n                showResult('❌ Firebase no disponible', 'error');\n                return;\n            }\n\n            const { database, ref, remove } = window.firebase;\n            \n            try {\n                await remove(ref(database, 'purchases'));\n                showResult('✅ Todas las compras eliminadas', 'success');\n            } catch (error) {\n                showResult(`❌ Error eliminando: ${error.message}`, 'error');\n            }\n        }\n\n        // Auto-generar una compra al cargar la página\n        window.addEventListener('load', () => {\n            setTimeout(() => {\n                if (window.firebase) {\n                    generateTestPurchase();\n                }\n            }, 2000);\n        });\n    </script>\n</body>\n</html>
