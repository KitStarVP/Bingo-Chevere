<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admin Panel</title>
</head>
<body>
    <h1>Test Admin Panel</h1>
    <button onclick="testAlert()">Test Alert</button>
    <button onclick="testConfirm()">Test Confirm</button>
    <button onclick="testPrompt()">Test Prompt</button>
    
    <script src="../js/custom-popups.js"></script>
    <script>
        function testAlert() {
            alert('Test alert - should work normally');
        }
        
        function testConfirm() {
            const result = confirm('Test confirm - should work normally');
            console.log('Confirm result:', result);
        }
        
        function testPrompt() {
            const result = prompt('Test prompt - should work normally', 'default');
            console.log('Prompt result:', result);
        }
    </script>
</body>
</html>
